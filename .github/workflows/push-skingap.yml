name: push-skingap

on:
  # Déclenchement manuel (bouton "Run workflow" dans l'onglet Actions du repo).
  workflow_dispatch:

  # Toutes les 5 min, décalé de 2 min pour éviter les créneaux ronds surchargés
  schedule:
    - cron: "2-59/5 * * * *"

jobs:
  push-skingap:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # garde-fou : tue le job s'il traîne (évite de bouffer le quota bêtement)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Génération du rapport SkinGap
        env:
          SKINPORT_CLIENT_ID: ${{ secrets.SKINPORT_CLIENT_ID }}
          SKINPORT_CLIENT_SECRET: ${{ secrets.SKINPORT_CLIENT_SECRET }}
        run: java SkinGap.java skingap.html

      - name: Injection de l'URL du dashboard
        run: sed -i "s|__DASHBOARD_URL__|${{ secrets.DASHBOARD_URL }}|g" skingap.html

      - name: Injection de l'auto-refresh (5 min)
        run: |
          sed -i 's#</body>#<script>setTimeout(()=>location.reload(),300000)</script></body>#' skingap.html

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Envoi vers le VM
        run: |
          # account-stats.json n'existe que si SKINPORT_CLIENT_ID/SECRET sont configurés
          # (voir SkinGap.java) ; on l'ajoute au scp seulement s'il a été généré, pour ne
          # pas casser le workflow tant que les secrets ne sont pas encore en place.
          FILES="skingap.html skins.json"
          [ -f account-stats.json ] && FILES="$FILES account-stats.json"

          scp -i ~/.ssh/id_ed25519 $FILES \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
            sudo mv ~/skingap.html /opt/tradelock/server/static/skingap.html &&
            sudo mv ~/skins.json /opt/tradelock/server/static/skins.json &&
            if [ -f ~/account-stats.json ]; then
              sudo mv ~/account-stats.json /opt/tradelock/server/static/account-stats.json &&
              sudo chown tradelock:tradelock /opt/tradelock/server/static/account-stats.json
            fi &&
            sudo chown tradelock:tradelock /opt/tradelock/server/static/skingap.html /opt/tradelock/server/static/skins.json &&
            echo "OK — skingap.html, skins.json (et account-stats.json si présent) mis à jour sur le VM."
          '
