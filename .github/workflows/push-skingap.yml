name: push-skingap

on:
  # Déclencheur PRINCIPAL : appel API "workflow_dispatch" envoyé toutes les 5 min par
  # cron-job.org (POST https://api.github.com/repos/cece35/lock-tracker/actions/workflows/push-skingap.yml/dispatches
  # avec body {"ref":"main"} et un token GitHub fine-grained "Actions: read & write" sur ce repo).
  # C'est la seule méthode fiable : voir plus bas pourquoi le "schedule" ne suffit pas.
  workflow_dispatch:

  # Filet de sécurité UNIQUEMENT (si cron-job.org tombe). GitHub ne garantit pas les
  # "schedule" : en charge, les exécutions sont retardées de 10-60 min ou purement
  # abandonnées — constaté sur ce repo : 13 exécutions en 3 jours pour un cron "toutes les
  # 5 min" (au lieu de ~860). Inutile donc de le remettre à 5 min : une fois par heure suffit
  # pour un fallback, et évite de doubler les appels à l'API Skinport.
  schedule:
    - cron: "17 * * * *"

# Jamais deux générations en parallèle (dispatch cron-job.org + fallback, ou relance manuelle) :
# l'API Skinport limite /v1/items + /v1/sales/history à 8 requêtes / 5 min, et chaque requête
# envoyée pendant un blocage 429 le prolonge d'une fenêtre complète. La suivante attend.
concurrency:
  group: push-skingap
  cancel-in-progress: false

jobs:
  push-skingap:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # garde-fou : tue le job s'il traîne (évite de bouffer le quota bêtement)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Images des autocollants, caisses, agents… (≈ 60 Mo de catalogues ByMykel) : condensées une fois par jour
      # par SkinGap.java dans img-cache/, gardé entre les runs (clé du jour : un seul enregistrement par jour).
      - name: Date du jour (cache d'images)
        id: jour
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache d'images
        uses: actions/cache@v4
        with:
          path: img-cache
          key: images-v1-${{ steps.jour.outputs.d }}
          restore-keys: images-v1-

      - name: Génération du rapport SkinGap
        env:
          SKINPORT_CLIENT_ID: ${{ secrets.SKINPORT_CLIENT_ID }}
          SKINPORT_CLIENT_SECRET: ${{ secrets.SKINPORT_CLIENT_SECRET }}
          SKINGAP_RAW_DIR: raw   # réponses brutes de l'API, pour l'archive horaire (dernière étape)
        run: java SkinGap.java skingap.html

      - name: Injection de l'URL du dashboard
        run: sed -i "s|__DASHBOARD_URL__|${{ secrets.DASHBOARD_URL }}|g" skingap.html

      - name: Injection de l'auto-refresh (5 min)
        run: |
          sed -i 's#</body>#<script>setTimeout(()=>location.reload(),300000)</script></body>#' skingap.html

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Envoi vers le VM
        run: |
          # account-stats.json n'existe que si SKINPORT_CLIENT_ID/SECRET sont configurés
          # (voir SkinGap.java) ; on l'ajoute au scp seulement s'il a été généré, pour ne
          # pas casser le workflow tant que les secrets ne sont pas encore en place.
          # annonces.html : page statique du dépôt (lots d'annonces + offres trade-protect), qui lit
          # skins.json et book.json (carnet d'annonces du VM, lien dans le même dossier) en relatif.
          FILES="skingap.html skins.json annonces.html"
          [ -f account-stats.json ] && FILES="$FILES account-stats.json"

          # ConnectTimeout : un VM qui ne répond pas faisait pendre le job jusqu'au
          # timeout-minutes (exécutions "cancelled"/"failure" à l'étape d'envoi).
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          scp $SSH_OPTS $FILES \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/"
          ssh $SSH_OPTS "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
            sudo mv ~/skingap.html /opt/tradelock/server/static/skingap.html &&
            sudo mv ~/skins.json /opt/tradelock/server/static/skins.json &&
            sudo mv ~/annonces.html /opt/tradelock/server/static/annonces.html &&
            if [ -f ~/account-stats.json ]; then
              sudo mv ~/account-stats.json /opt/tradelock/server/static/account-stats.json &&
              sudo chown tradelock:tradelock /opt/tradelock/server/static/account-stats.json
            fi &&
            sudo chown tradelock:tradelock /opt/tradelock/server/static/skingap.html /opt/tradelock/server/static/skins.json /opt/tradelock/server/static/annonces.html &&
            echo "OK — skingap.html, skins.json, annonces.html (et account-stats.json si présent) mis à jour sur le VM."
          '

      - name: Photo du marché toutes les 5 min (sur le VM)
        # À chaque exécution : marché tradable + marché complet (min, quantité par skin), compressés
        # (~2 Mo), dans ~/skinport-data/rest5/AAAA-MM-JJ/HHMM/. Sert au carnet d'annonces du VM
        # (repérer les annulations et recaler le carnet après une coupure du flux) ; le VM ne peut
        # pas appeler l'API lui-même (bloqué par Cloudflare). On garde 7 jours (~4 Go) ; l'archive
        # horaire complète (étape suivante) reste, elle, conservée. Ne modifie pas raw/.
        # Non bloquant : le site est déjà à jour à cette étape.
        continue-on-error: true
        run: |
          [ -s raw/t0.txt ] && [ -s raw/items_t.json ] && [ -s raw/items_g.json ] || { echo "Pas de réponses brutes"; exit 0; }
          T=$(cat raw/t0.txt)
          DAY=$(date -u -d "@$T" +%F); HM=$(date -u -d "@$T" +%H%M)
          mkdir -p r5
          xz -T0 -3 -c raw/items_t.json > r5/items_t.json.xz
          xz -T0 -3 -c raw/items_g.json > r5/items_g.json.xz
          cp raw/t0.txt r5/
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o LogLevel=ERROR"
          DEST="${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}"
          R="skinport-data/rest5/$DAY"
          ssh $SSH_OPTS "$DEST" "mkdir -p ~/$R && rm -rf ~/$R/$HM.tmp"
          scp $SSH_OPTS -r r5 "$DEST:$R/$HM.tmp"
          # mise en place atomique (le carnet ne lit jamais une photo à moitié copiée), lien "latest",
          # puis suppression des jours de plus de 7 jours (uniquement des dossiers AAAA-MM-JJ de rest5)
          ssh $SSH_OPTS "$DEST" "rm -rf ~/$R/$HM && mv ~/$R/$HM.tmp ~/$R/$HM && ln -sfn $DAY/$HM ~/skinport-data/rest5/latest &&
            find ~/skinport-data/rest5 -mindepth 1 -maxdepth 1 -type d -name '20??-??-??' -mtime +7 -exec rm -rf {} +"
          echo "Photo 5 min : $DAY $HM ($(du -sh r5 | cut -f1))"

      - name: Archive horaire des réponses brutes de l'API (sur le VM)
        # Une copie par heure UTC des trois réponses de l'API (marché tradable, marché complet,
        # historique des ventes), compressée (~3 Mo), dans ~/skinport-data/rest/AAAA-MM-JJ/HH/ :
        # de quoi recalibrer le modèle sur des semaines de données, sans aucun appel API en plus.
        # Non bloquant : le site est déjà à jour à cette étape.
        continue-on-error: true
        run: |
          [ -s raw/t0.txt ] || { echo "Pas d'archive brute (SKINGAP_RAW_DIR)"; exit 0; }
          T=$(cat raw/t0.txt)
          DAY=$(date -u -d "@$T" +%F); HOUR=$(date -u -d "@$T" +%H)
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o LogLevel=ERROR"
          DEST="${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}"
          R="skinport-data/rest/$DAY"
          if ssh $SSH_OPTS "$DEST" "test -d ~/$R/$HOUR"; then
            echo "Déjà archivé pour $DAY ${HOUR}h"; exit 0
          fi
          xz -T0 -6 raw/*.json
          ssh $SSH_OPTS "$DEST" "mkdir -p ~/$R && rm -rf ~/$R/$HOUR.tmp"
          scp $SSH_OPTS -r raw "$DEST:$R/$HOUR.tmp"
          ssh $SSH_OPTS "$DEST" "mv ~/$R/$HOUR.tmp ~/$R/$HOUR"
          echo "Archivé : $DAY ${HOUR}h ($(du -sh raw | cut -f1))"
